name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java (Версия 17 оптимальна для Flutter 3.19)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Настраиваем Flutter конкретной версии (Фиксируем 3.19.6)
      # Это решает проблему несовместимости с новой версией Gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          version: '3.19.6'
          cache: true

      # 4. Проверяем установленную версию
      - name: Check Flutter version
        run: flutter --version

      # 5. Загружаем зависимости проекта
      - name: Install dependencies
        run: flutter pub get

      # 6. Собираем APK-файл в режиме release
      - name: Build APK
        run: flutter build apk --release

      # 7. Загружаем готовый APK в артефакты GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calm-Attack-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
