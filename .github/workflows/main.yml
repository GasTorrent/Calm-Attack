name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Downgrade flutter_lints constraint
        run: "sed -i 's/flutter_lints: \\^6.0.0/flutter_lints: ^5.0.0/' pubspec.yaml"

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: calm-attack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
